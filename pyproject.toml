[project]
name = "auctioneer-bot"
version = "0.1.0"
description = "Telegram bot for tracking Sunflower Land auctions"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.13",
    "apscheduler>=3.10",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "Pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
