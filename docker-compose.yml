services:
  auctioneer-bot:
    # Образ собирается в GitHub Actions по тегам v* (см. .github/workflows).
    # Раньше была build: . — но тогда Deploy в Komodo не пересобирал код,
    # и контейнер жил на старой версии.
    image: ghcr.io/dionis404/auctioneer-bot:latest
    pull_policy: always
    container_name: auctioneer-bot
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - shared-net
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY}
      ALERT_CHAT_ID: ${ALERT_CHAT_ID}
      NOTIFY_CHAT_ID: ${NOTIFY_CHAT_ID}
      ADMIN_IDS: ${ADMIN_IDS}
      SITE_IMAGE_BASE_URL: ${SITE_IMAGE_BASE_URL:-https://goblincodex.fun/sprites/}
      TZ: Europe/Moscow
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE}

networks:
  shared-net:
    external: true